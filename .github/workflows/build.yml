name: Build

env:
  main_project_module: app

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bump version and push tag (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: bump_and_tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          PRERELEASE: true
          PRERELEASE_SUFFIX: build
          INITIAL_VERSION: 1.0.0

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set Build Config
        id: build_config
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "FLAVOR=dev" >> $GITHUB_ENV
            echo "ASSEMBLE_TASK=assembleDevRelease" >> $GITHUB_ENV
            echo "RELEASE_DIR=app/build/outputs/apk/dev/release" >> $GITHUB_ENV
            echo "APK_PREFIX=app-dev-release" >> $GITHUB_ENV
            echo "release_dir=app/build/outputs/apk/dev/release" >> $GITHUB_OUTPUT
          else
            echo "FLAVOR=prod" >> $GITHUB_ENV
            echo "ASSEMBLE_TASK=assembleProdRelease" >> $GITHUB_ENV
            echo "RELEASE_DIR=app/build/outputs/apk/prod/release" >> $GITHUB_ENV
            echo "APK_PREFIX=app-prod-release" >> $GITHUB_ENV
            echo "release_dir=app/build/outputs/apk/prod/release" >> $GITHUB_OUTPUT
          fi

      - name: Assemble APK
        run: |
          TAG_VERSION="${{ steps.bump_and_tag.outputs.new_tag }}"
          if [ -z "$TAG_VERSION" ]; then
            TAG_VERSION="1.0.0-pr"
          fi
          ./gradlew \
            -Pandroid.versionName="$TAG_VERSION" \
            "${ASSEMBLE_TASK}"

      - name: Sign Android release
        id: sign_app
        uses: r0adkll/sign-android-release@d5f8436b702872ad5cdb1e6e4d5c8b983d25a997
        with:
          releaseDirectory: ${{ steps.build_config.outputs.release_dir }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || 'key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || 'password' }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare Signed APK artifact
        run: |
          TAG_VERSION="${{ steps.bump_and_tag.outputs.new_tag }}"
          if [ -z "$TAG_VERSION" ]; then
            TAG_VERSION="1.0.0-pr-${{ github.run_number }}"
          fi
          if [ -f "${RELEASE_DIR}/${APK_PREFIX}-unsigned-signed.apk" ]; then
            cp "${RELEASE_DIR}/${APK_PREFIX}-unsigned-signed.apk" "pixelfed-client-${TAG_VERSION}.apk"
          else
            cp "${RELEASE_DIR}/${APK_PREFIX}-unsigned.apk" "pixelfed-client-${TAG_VERSION}.apk"
          fi

      - name: Upload APK Artifact (PR & Main)
        uses: actions/upload-artifact@v4
        with:
          name: pixelfed-client-apk
          path: pixelfed-client-*.apk

      - name: Release (Main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_and_tag.outputs.new_tag }}
          files: pixelfed-client-${{ steps.bump_and_tag.outputs.new_tag }}.apk
