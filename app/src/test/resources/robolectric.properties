# KNOWN CONSTRAINT: the JVM test stack runs on API 34 while the app compiles against SDK 37 and
# targets 35. The API 34 android-all runtime is not fetched while a test initialises: the Gradle
# build declares `androidAllInstrumented` in gradle/libs.versions.toml, stages that jar through
# `copyRobolectricAndroidAll`, and runs Robolectric with `robolectric.offline=true` against it.
# The declared version must keep tracking this pin, or every Robolectric test fails with
# "Unable to locate dependency".
# Consequence: nothing in the JVM suite covers API 35+ runtime behaviour, so such a change must be
# validated on a device/emulator rather than by the JVM tests.
sdk=34
