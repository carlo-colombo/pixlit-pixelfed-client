plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.hilt)
    alias(libs.plugins.ksp)
}

android {
    namespace 'ovh.litapp.pixlit'
    compileSdk 37

    def isCiMain = System.getenv("GITHUB_ACTIONS") == "true" && System.getenv("GITHUB_REF") == "refs/heads/main"
    def buildSuffix = isCiMain ? "" : " (Internal)"

    defaultConfig {
        applicationId "ovh.litapp.pixlit"
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        manifestPlaceholders = [
            appAuthRedirectScheme: "pixelfed-app",
            appLabel: "Pixlit" + buildSuffix
        ]
    }

    flavorDimensions = ["env"]
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            manifestPlaceholders.appLabel = "Pixlit Dev" + buildSuffix
        }
        prod {
            dimension "env"
            manifestPlaceholders.appLabel = "Pixlit" + buildSuffix
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests.all {
            maxHeapSize = "2048m"
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.core
    implementation libs.androidx.material.icons.extended
    implementation libs.androidx.browser

    // OkHttp & Retrofit
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.retrofit
    implementation libs.retrofit.gson

    // Coil for image loading
    implementation libs.coil.compose

    // Coroutines
    implementation libs.kotlinx.coroutines.android

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.compose

    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    testImplementation libs.junit
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.junit
    testImplementation libs.robolectric
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.turbine
    testImplementation libs.mockk
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
