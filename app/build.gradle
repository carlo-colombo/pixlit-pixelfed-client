import org.gradle.api.DefaultTask
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.FileSystemOperations
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

import javax.inject.Inject

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.hilt)
    alias(libs.plugins.ksp)
}

// Robolectric resolves its own android-all runtime: its LegacyDependencyResolver falls back to a
// live Maven fetch into ~/.m2 unless it is pointed at a local jar, and the first CI run of the new
// release pipeline hung on that fetch while a test sandbox was initialising. Declaring the artifact
// here puts the download through ordinary Gradle dependency resolution (and Gradle's dependency
// caches), and `copyRobolectricAndroidAll` stages the jar flat, which is the layout Robolectric's
// LocalDependencyResolver looks in. Keep the version in lockstep with the `sdk=34` pin in
// app/src/test/resources/robolectric.properties.
configurations.create("robolectricAndroidAll") {
    canBeConsumed = false
    canBeResolved = true
}
def robolectricAndroidAllDir = layout.buildDirectory.dir("robolectric-android-all")
def copyRobolectricAndroidAll = tasks.register("copyRobolectricAndroidAll", Copy) {
    description = "Stages Robolectric's android-all runtime jar for offline unit tests."
    from(configurations.named("robolectricAndroidAll"))
    into(robolectricAndroidAllDir)
}

// The app's own license and the dependency notices are staged into a generated assets directory
// rather than committed under app/src/main/assets: the root LICENSE/NOTICE/THIRD_PARTY_LICENSES.md
// stay the single source of truth, so a packaged copy can never drift from them. The Variant-API
// wiring below carries the task dependency, so every asset merge waits for the copy.
// `LicenseAssetsTest` pins that they actually reach the merged assets.
//
// This is not a plain `Copy`: `addGeneratedSourceDirectory` needs a DirectoryProperty that is one
// of the task's own outputs, and `Copy.destinationDirectory` only exists from Gradle 9.8 (this
// build runs Gradle 9.5), so the task declares its output itself. It copies through injected
// FileSystemOperations rather than `project` to stay configuration-cache compatible.
abstract class StageLicenseAssetsTask extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getSources()

    @OutputDirectory
    abstract DirectoryProperty getDestinationDirectory()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void stage() {
        getFileSystemOperations().sync { spec ->
            spec.into(getDestinationDirectory())
            spec.from(getSources()) { into("licenses") }
        }
    }
}

def stageLicenseAssets = tasks.register("stageLicenseAssets", StageLicenseAssetsTask) {
    description = "Stages LICENSE, NOTICE and THIRD_PARTY_LICENSES.md into the APK's assets."
    sources.from(
        rootProject.file("LICENSE"),
        rootProject.file("NOTICE"),
        rootProject.file("THIRD_PARTY_LICENSES.md")
    )
    destinationDirectory.set(layout.buildDirectory.dir("generated/license-assets"))
}

android {
    namespace = 'ovh.litapp.pixlit'
    compileSdk 37

    defaultConfig {
        applicationId "ovh.litapp.pixlit"
        minSdk 34
        // Matches compileSdk: the JVM tests pin their own SDK via
        // app/src/test/resources/robolectric.properties, so this bump cannot force Robolectric
        // onto an SDK runtime it does not ship.
        targetSdk 37
        // CI passes -Pandroid.versionName/-Pandroid.versionCode derived from the release tag.
        // The fallbacks keep local and PR builds on the historical 1.0.0 / 1 values.
        versionCode = (findProperty("android.versionCode") ?: "1").toString().toInteger()
        versionName = (findProperty("android.versionName") ?: "1.0.0").toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [appAuthRedirectScheme: "pixlit", appLabel: "Pixlit"]

        // Surfaced in Settings -> About so the app can state its own license and point at the
        // Corresponding Source for the exact build (GPLv3 section 6).
        buildConfigField("String", "SOURCE_URL", "\"https://github.com/carlo-colombo/pixlit-pixelfed-client\"")
        buildConfigField("String", "LICENSE_IDENTIFIER", "\"GPL-3.0-or-later\"")
    }

    flavorDimensions = ["distribution", "env"]
    productFlavors {
        local {
            dimension "distribution"
            applicationIdSuffix ".local"
            manifestPlaceholders.appLabel = "Pixlit (Internal)"
        }
        ci {
            dimension "distribution"
        }
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            manifestPlaceholders.appLabel = "Pixlit Dev"
            manifestPlaceholders.appAuthRedirectScheme = "pixlit-dev"
            // Debug tooling (Debug tab, Simulate Art Show Notification) is dev-only. The env
            // dimension is the single source of this flag; distribution flavors (local/ci) must
            // not also set it or the higher-priority dimension would override the env value.
            buildConfigField("boolean", "DEBUG_TOOLS", "true")
        }
        prod {
            dimension "env"
            manifestPlaceholders.appLabel = "Pixlit"
            buildConfigField("boolean", "DEBUG_TOOLS", "false")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        // Robolectric reads the merged manifest and resources through the unit-test classpath.
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = "2048m"
            jvmArgs "-Xshare:off"
            // Stage the pinned android-all runtime and force Robolectric to use it offline, so no
            // test run ever depends on a live Maven fetch.
            dependsOn(copyRobolectricAndroidAll)
            systemProperty "robolectric.offline", "true"
            systemProperty "robolectric.dependency.dir", robolectricAndroidAllDir.get().asFile.absolutePath
            inputs.property("robolectricAndroidAll", libs.versions.androidAllInstrumented.get())
        }
    }

    lint {
        // Full lint (not just AGP's automatic lintVital*Release) must fail the build on errors.
        // A lint baseline has not been generated yet, so every current warning must stay visible;
        // once the first CI lint run establishes the pre-existing debt, commit a baseline and set
        // warningsAsErrors = true.
        abortOnError = true
        // checkDependencies is deliberately off: analysing every dependency's lint was the largest
        // single memory consumer in the release job and contributed to a runner OOM.
        warningsAsErrors = false
    }
}

// AGP 9 refuses Provider-backed task outputs in the legacy `sourceSets` API ("You cannot add
// Provider instances to the Android SourceSet API"), so the generated assets directory is wired
// through the Variant API, which carries the task dependency for every variant. The callback must
// return one of the task's own output properties, which is why `stageLicenseAssets` declares
// `destinationDirectory` itself.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(stageLicenseAssets) { it.destinationDirectory }
    }
}

// REL-12: point Room's annotation processor at a checked-in schema directory, so the data lane can
// set `exportSchema = true` in AppDatabase and commit the generated version JSON for future
// migrations to diff and test against. Nothing is written while exportSchema stays false.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

// BUILD-11: emit Compose compiler metrics and the skippability report under the module build
// directory. Both are gitignored build output, so this changes nothing in the packaged APK. No
// stability configuration file is wired: the generated report lists no non-skippable composable and
// no app-owned holder type whose stability promise would change that, so there is nothing to
// declare. Re-check app/build/compose-reports when a new state holder is introduced.
composeCompiler {
    metricsDestination.set(layout.buildDirectory.dir("compose-metrics"))
    reportsDestination.set(layout.buildDirectory.dir("compose-reports"))
}

// This module compiles Kotlin through AGP's built-in Kotlin support (the Kotlin Android plugin is
// not applied), so the Kotlin compile tasks are configured directly; compileOptions above only pins
// the Java side.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

// Keep the conventional test task usable while local builds default to dev.
tasks.register("testDebugUnitTest") {
    dependsOn("testLocalDevDebugUnitTest")
}

