# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process. The metaspace cap stops the
# KSP + R8 native-image work from growing metaspace without bound.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Reuse the configuration phase result between Gradle invocations. AGP 9 + KSP 2 are
# configuration-cache compatible, but the property is new here; if a CC problem surfaces
# it is reported as a build failure rather than silently ignored.
org.gradle.configuration-cache=true
# Persist task outcomes between builds and run independent work in parallel.
org.gradle.caching=true
org.gradle.parallel=true
# Watch the file system instead of polling it.
org.gradle.vfs.watch=true
android.useAndroidX=true
android.nonTransitiveRclass=true
# Kotlin/KSP incremental compilation must stay on so the caches above pay off.
kotlin.incremental=true
ksp.incremental=true
